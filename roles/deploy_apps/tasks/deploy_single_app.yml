---
# Capistrano-style deployment for a single app
# Directory structure: /opt/app-name/{current, releases, shared, repo}

- name: "Set app variables for {{ app.name }}"
  set_fact:
    app_name: "{{ app.name }}"
    app_repo: "{{ app.repo }}"
    app_branch: "{{ app.branch | default('main') }}"
    app_base_dir: "{{ apps_base_dir }}/{{ app.name }}"
    app_hostname: "{{ app.hostname | default(app.name + '.' + ansible_default_ipv4.address + '.nip.io') }}"
    app_port: "{{ app.port | default('3000') }}"
    deploy_timestamp: "{{ ansible_date_time.epoch }}"
    release_dir: "{{ apps_base_dir }}/{{ app.name }}/releases/{{ ansible_date_time.epoch }}"

- name: "Display deployment info for {{ app_name }}"
  debug:
    msg: |
      🚀 Deploying {{ app_name }} (Capistrano-style):
      - Repository: {{ app_repo }}
      - Branch: {{ app_branch }}
      - Base Directory: {{ app_base_dir }}
      - Release: {{ deploy_timestamp }}
      - Hostname: {{ app_hostname }}
      - Port: {{ app_port }}

- name: "Setup SSH keys for private repository access"
  include_tasks: setup_ssh_keys.yml

- name: "Create Capistrano directory structure for {{ app_name }}"
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ apps_user }}"
    group: "{{ apps_group }}"
    mode: "0755"
  loop:
    - "{{ app_base_dir }}"
    - "{{ app_base_dir }}/releases"
    - "{{ app_base_dir }}/shared"
    - "{{ app_base_dir }}/shared/config"
    - "{{ app_base_dir }}/shared/logs"
    - "{{ app_base_dir }}/shared/data"
    - "{{ app_base_dir }}/backups"

- name: "Ensure repo directory exists for {{ app_name }}"
  file:
    path: "{{ app_base_dir }}/repo"
    state: directory
    owner: "{{ apps_user }}"
    group: "{{ apps_group }}"
    mode: "0755"
  become: true

- name: "Bulletproof git repository setup for {{ app_name }}"
  shell: |
    set -e

    echo "🔧 Setting up Git repository for {{ app_name }}..."

    # Fix ownership of repo directory if it exists
    if [ -d "{{ app_base_dir }}/repo" ]; then
      echo "Fixing ownership of existing repo..."
      chown -R {{ apps_user }}:{{ apps_group }} "{{ app_base_dir }}/repo"
    fi

    # Configure git as apps_user
    sudo -u {{ apps_user }} git config --global --add safe.directory "{{ app_base_dir }}/repo"

    # Clone or update repository as apps_user
    if [ ! -d "{{ app_base_dir }}/repo/.git" ]; then
      echo "🔽 Cloning repository..."
      sudo -u {{ apps_user }} git clone "{{ app_repo_ssh | default(app_repo) }}" "{{ app_base_dir }}/repo"
    else
      echo "🔄 Updating existing repository..."
      cd "{{ app_base_dir }}/repo"
      sudo -u {{ apps_user }} git fetch origin
      sudo -u {{ apps_user }} git reset --hard origin/{{ app_branch }}
    fi

    # Verify we have the latest code
    cd "{{ app_base_dir }}/repo"
    sudo -u {{ apps_user }} git checkout {{ app_branch }}
    current_hash=$(sudo -u {{ apps_user }} git rev-parse HEAD)
    remote_hash=$(sudo -u {{ apps_user }} git rev-parse origin/{{ app_branch }})

    if [ "$current_hash" = "$remote_hash" ]; then
      echo "✅ Repository is up to date with origin/{{ app_branch }}"
      echo "Current commit: $current_hash"
    else
      echo "❌ Local repository does not match remote"
      echo "Local: $current_hash"
      echo "Remote: $remote_hash"
      exit 1
    fi
  become: true
  environment:
    GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=no"
  register: git_update_result

- name: "Get git commit hash for {{ app_name }}"
  shell: git rev-parse HEAD
  args:
    chdir: "{{ app_base_dir }}/repo"
  become: true
  become_user: "{{ apps_user }}"
  register: git_commit_result
  changed_when: false

- name: "Store git commit hash for {{ app_name }}"
  set_fact:
    git_commit_hash: "{{ git_commit_result.stdout }}"

- name: "Create new release directory for {{ app_name }}"
  file:
    path: "{{ release_dir }}"
    state: directory
    owner: "{{ apps_user }}"
    group: "{{ apps_group }}"
    mode: "0755"

- name: "Copy code to release directory for {{ app_name }}"
  synchronize:
    src: "{{ app_base_dir }}/repo/"
    dest: "{{ release_dir }}/"
    delete: true
    recursive: true
  delegate_to: "{{ inventory_hostname }}"
  become: true
  become_user: "{{ apps_user }}"

- name: "Check if .env.vault exists locally for {{ app_name }}"
  stat:
    path: "{{ playbook_dir }}/../env_files/{{ app_name }}.env.vault"
  register: local_env_vault_exists
  delegate_to: localhost
  become: false

- name: "Decrypt .env file locally for {{ app_name }}"
  shell: |
    cd {{ playbook_dir }}/..
    if [ -f "env_files/{{ app_name }}.env.vault" ]; then
      ansible-vault decrypt "env_files/{{ app_name }}.env.vault" --output="/tmp/{{ app_name }}.env.decrypted" --vault-password-file=.vault_pass
      echo "✅ .env file decrypted locally"
    else
      echo "⚠️  No .env.vault found locally, skipping decryption"
      exit 1
    fi
  delegate_to: localhost
  become: false
  register: local_env_decrypt_result
  when: local_env_vault_exists.stat.exists
  changed_when: false

- name: "Transfer decrypted .env file to server for {{ app_name }}"
  copy:
    src: "/tmp/{{ app_name }}.env.decrypted"
    dest: "{{ app_base_dir }}/shared/config/.env"
    owner: "{{ apps_user }}"
    group: "{{ apps_group }}"
    mode: "0600"
  become: true
  when: local_env_vault_exists.stat.exists

- name: "Clean up local temporary .env file for {{ app_name }}"
  file:
    path: "/tmp/{{ app_name }}.env.decrypted"
    state: absent
  delegate_to: localhost
  become: false
  when: local_env_vault_exists.stat.exists

- name: "Inject deployment variables into .env for {{ app_name }}"
  lineinfile:
    path: "{{ app_base_dir }}/shared/config/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
  loop:
    - { key: "APP_NAME", value: "{{ app_name }}" }
    - { key: "APP_ENV", value: "production" }
    - { key: "PORT", value: "{{ app_port }}" }
    - { key: "DB_PORT", value: "{{ app.postgres_port | default('5432') }}" }
    - { key: "DB_NAME", value: "{{ app_name }}_production" }
    - { key: "DB_USERNAME", value: "{{ app_name }}" }
    - { key: "CADDY_HOSTNAME", value: "{{ app_hostname }}" }
    - { key: "PROXY_NETWORK", value: "{{ proxy_network_name }}" }
  become: true
  become_user: "{{ apps_user }}"
  when: local_env_vault_exists.stat.exists

- name: "Create symlinks to shared files for {{ app_name }}"
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - {
        src: "{{ app_base_dir }}/shared/config/.env",
        dest: "{{ release_dir }}/.env",
      }
    - { src: "{{ app_base_dir }}/shared/logs", dest: "{{ release_dir }}/logs" }
    - { src: "{{ app_base_dir }}/shared/data", dest: "{{ release_dir }}/data" }
  become: true
  become_user: "{{ apps_user }}"
  ignore_errors: true

- name: "Check if docker-compose.yml exists for {{ app_name }}"
  stat:
    path: "{{ release_dir }}/docker-compose.yml"
  register: compose_file

- name: "Check if compose.yml exists for {{ app_name }}"
  stat:
    path: "{{ release_dir }}/compose.yml"
  register: compose_file_alt
  when: not compose_file.stat.exists

- name: "Fail if no compose file found for {{ app_name }}"
  fail:
    msg: "No docker-compose.yml or compose.yml found in {{ release_dir }}"
  when: not compose_file.stat.exists and not compose_file_alt.stat.exists

- name: "Stop existing containers for {{ app_name }}"
  shell: |
    if [ -L "{{ app_base_dir }}/current" ] && [ -f "{{ app_base_dir }}/current/docker-compose.yml" -o -f "{{ app_base_dir }}/current/compose.yml" ]; then
      cd "{{ app_base_dir }}/current"
      
      # Create database backup before stopping
      echo "💾 Creating database backup before deployment..."
      backup_file="{{ app_base_dir }}/backups/db_backup_{{ deploy_timestamp }}.sql"
      mkdir -p "{{ app_base_dir }}/backups"
      
      if {{ compose_command }} exec -T postgres pg_dump -U postgres {{ app_name }} > "$backup_file" 2>/dev/null; then
        echo "✅ Database backup created: $backup_file"
        # Keep only last {{ backups_to_keep }} backups
        cd "{{ app_base_dir }}/backups"
        ls -1t db_backup_*.sql 2>/dev/null | tail -n +{{ backups_to_keep | int + 1 }} | xargs -r rm -f
      else
        echo "⚠️  Database backup failed or database not running"
      fi
      
      {{ compose_command }} down || true
      echo "🛑 Stopped existing containers"
    else
      echo "ℹ️  No existing deployment to stop"
    fi
  become: true
  become_user: "{{ apps_user }}"
  register: stop_result

- name: "Check if app needs to be built from source"
  shell: "{{ compose_command }} config | grep -q 'build:'"
  args:
    chdir: "{{ release_dir }}"
  become: true
  become_user: "{{ apps_user }}"
  register: needs_build
  failed_when: false
  changed_when: false

- name: "Build {{ app_name }} with progress output"
  shell: |
    echo "🏗️  Building {{ app_name }} release {{ deploy_timestamp }}..."
    {{ compose_command }} build --progress=plain {{ '--no-cache' if force_rebuild | default(false) else '' }} 2>&1 | tee "{{ app_base_dir }}/shared/logs/build_{{ deploy_timestamp }}.log"
    build_exit_code=$?
    if [ $build_exit_code -eq 0 ]; then
      echo "✅ Build completed successfully"
    else
      echo "❌ Build failed with exit code $build_exit_code"
    fi
    exit $build_exit_code
  args:
    chdir: "{{ release_dir }}"
  become: true
  become_user: "{{ apps_user }}"
  environment:
    CADDY_HOSTNAME: "{{ app_hostname }}"
    CADDY_PORT: "{{ app_port }}"
    PROXY_NETWORK: "{{ proxy_network_name }}"
  register: build_result
  when: needs_build.rc == 0

- name: "Get current release for rollback capability for {{ app_name }}"
  shell: |
    if [ -L "{{ app_base_dir }}/current" ]; then
      readlink "{{ app_base_dir }}/current" | sed 's|releases/||'
    else
      echo "none"
    fi
  become: true
  become_user: "{{ apps_user }}"
  register: previous_release_result
  changed_when: false

- name: "Set rollback information for {{ app_name }}"
  set_fact:
    previous_release: "{{ previous_release_result.stdout }}"
    deployment_failed: false

- name: "Atomic deployment with automatic rollback for {{ app_name }}"
  block:
    - name: "Create current symlink (atomic deployment) for {{ app_name }}"
      shell: |
        # Atomic deployment using symlink swap
        cd "{{ app_base_dir }}"
        ln -sfn "releases/{{ deploy_timestamp }}" current_tmp
        mv current_tmp current
        echo "🔗 Current symlink updated to release {{ deploy_timestamp }}"
      become: true
      become_user: "{{ apps_user }}"

    - name: "Start {{ app_name }} from current release"
      shell: |
        echo "🚀 Starting {{ app_name }} from current release..."
        cd "{{ app_base_dir }}/current"
        {{ compose_command }} up -d 2>&1 | tee "{{ app_base_dir }}/shared/logs/deploy_{{ deploy_timestamp }}.log"
        deploy_exit_code=$?
        if [ $deploy_exit_code -eq 0 ]; then
          echo "✅ Deployment completed successfully"
          echo "ℹ️  Application will handle database migrations during startup"
        else
          echo "❌ Deployment failed with exit code $deploy_exit_code"
        fi
        exit $deploy_exit_code
      become: true
      become_user: "{{ apps_user }}"
      environment:
        CADDY_HOSTNAME: "{{ app_hostname }}"
        CADDY_PORT: "{{ app_port }}"
        PROXY_NETWORK: "{{ proxy_network_name }}"
      register: deploy_result

    - name: "Wait for containers to stabilize for {{ app_name }}"
      wait_for:
        timeout: 15
      delegate_to: localhost
      become: false

    - name: "Comprehensive health verification for {{ app_name }}"
      include_tasks: verify_deployment_health.yml

  rescue:
    - name: "Mark deployment as failed for {{ app_name }}"
      set_fact:
        deployment_failed: true
        deployment_error: "{{ ansible_failed_result.msg | default('Unknown deployment error') }}"

    - name: "Perform automatic rollback for {{ app_name }}"
      shell: |
        echo "💥 Deployment failed - performing automatic rollback..."
        cd "{{ app_base_dir }}"

        if [ "{{ previous_release }}" != "none" ]; then
          echo "🔄 Rolling back to previous release: {{ previous_release }}"
          
          # Stop current failed containers
          if [ -d "current" ]; then
            cd current
            {{ compose_command }} down || true
            cd ..
          fi
          
          # Restore previous symlink
          ln -sfn "releases/{{ previous_release }}" current_tmp
          mv current_tmp current
          
          # Start previous release
          cd current
          {{ compose_command }} up -d
          
          echo "✅ Rollback completed to release {{ previous_release }}"
        else
          echo "⚠️  No previous release to rollback to"
          
          # Just stop the failed deployment
          if [ -d "current" ]; then
            cd current
            {{ compose_command }} down || true
          fi
          
          # Remove the broken symlink
          rm -f current
        fi
      become: true
      become_user: "{{ apps_user }}"
      environment:
        CADDY_HOSTNAME: "{{ app_hostname }}"
        CADDY_PORT: "{{ app_port }}"
        PROXY_NETWORK: "{{ proxy_network_name }}"

    - name: "Fail deployment with rollback context for {{ app_name }}"
      fail:
        msg: |
          ❌ Deployment of {{ app_name }} failed and automatic rollback was performed.

          Error: {{ deployment_error }}
          Rolled back to: {{ previous_release if previous_release != 'none' else 'No previous release' }}

          Check logs:
          - Build: {{ app_base_dir }}/shared/logs/build_{{ deploy_timestamp }}.log
          - Deploy: {{ app_base_dir }}/shared/logs/deploy_{{ deploy_timestamp }}.log

          Troubleshoot: ansible-playbook playbooks/troubleshoot.yml -e app={{ app_name }}

- name: "Record successful deployment for {{ app_name }}"
  shell: |
    cd "{{ app_base_dir }}/current"
    echo "📊 Final Container Status for {{ app_name }}:"
    {{ compose_command }} ps
    echo ""
    echo "🏥 Final Health Check:"
    {{ compose_command }} logs --tail=10
  become: true
  become_user: "{{ apps_user }}"
  register: health_check
  changed_when: false
  when: not deployment_failed

- name: "Clean up old releases for {{ app_name }}"
  shell: |
    cd "{{ app_base_dir }}/releases"
    # Keep only the latest {{ releases_to_keep }} releases
    ls -1t | tail -n +{{ releases_to_keep | int + 1 }} | xargs -r rm -rf
    echo "🧹 Cleaned up old releases (keeping latest {{ releases_to_keep }})"
  become: true
  become_user: "{{ apps_user }}"
  ignore_errors: true

- name: "Save deployment metadata for {{ app_name }}"
  copy:
    content: |
      {
        "app_name": "{{ app_name }}",
        "repository": "{{ app_repo }}",
        "branch": "{{ app_branch }}",
        "release": "{{ deploy_timestamp }}",
        "deployed_at": "{{ ansible_date_time.iso8601 }}",
        "deployed_by": "{{ ansible_user_id }}",
        "hostname": "{{ app_hostname }}",
        "port": "{{ app_port }}",
        "git_commit_hash": "{{ git_commit_hash }}"
      }
    dest: "{{ release_dir }}/.deploy_metadata.json"
    owner: "{{ apps_user }}"
    group: "{{ apps_group }}"
    mode: "0644"

- name: "🎉 Enhanced deployment status report for {{ app_name }}"
  debug:
    msg: |
      {% if not deployment_failed %}
      ✅ {{ app_name }} DEPLOYMENT SUCCESSFUL!

      📦 Release Information:
      - Release ID: {{ deploy_timestamp }}
      - Git Commit: {{ git_commit_hash[:8] }}...
      - Branch: {{ app_branch }}
      - Deployed by: {{ ansible_user_id }}
      - Deployed at: {{ ansible_date_time.iso8601 }}

      🌐 Access Information:
      - URL: https://{{ app_hostname }}
      - Port: {{ app_port }}
      - Database Port: {{ app.postgres_port | default('5432') }}

      📁 Directory Structure:
      - Base: {{ app_base_dir }}
      - Current: {{ app_base_dir }}/current -> releases/{{ deploy_timestamp }}
      - Shared: {{ app_base_dir }}/shared
      - Backups: {{ app_base_dir }}/backups

      📝 Log Files:
      - Build: {{ app_base_dir }}/shared/logs/build_{{ deploy_timestamp }}.log
      - Deploy: {{ app_base_dir }}/shared/logs/deploy_{{ deploy_timestamp }}.log

      💡 Management Commands:
      # View logs: ssh {{ ansible_user }}@{{ ansible_host }} 'cd {{ app_base_dir }}/current && docker compose logs'
      # Check status: ssh {{ ansible_user }}@{{ ansible_host }} 'cd {{ app_base_dir }}/current && docker compose ps'
      # Rollback: ansible-playbook playbooks/deploy.yml -e mode=rollback -e apps_to_deploy={{ app_name }}

      📊 Container Status:
      {% for line in health_check.stdout_lines %}
      {{ line }}
      {% endfor %}
      {% else %}
      💥 {{ app_name }} DEPLOYMENT FAILED!

      ❌ Error: {{ deployment_error }}
      🔄 Rollback Status: {{ 'Completed to ' + previous_release if previous_release != 'none' else 'No previous release available' }}

      🔍 Troubleshooting:
      - Check logs: {{ app_base_dir }}/shared/logs/deploy_{{ deploy_timestamp }}.log
      - Run diagnostics: ansible-playbook playbooks/troubleshoot.yml -e app={{ app_name }}
      - Manual rollback: ansible-playbook playbooks/deploy.yml -e mode=rollback -e apps_to_deploy={{ app_name }}
      {% endif %}
  when: not deployment_failed or deployment_failed
